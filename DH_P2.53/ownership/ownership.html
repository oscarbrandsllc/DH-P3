<body data-page="ownership" class="p-2 sm:p-4">
<!-- Replaced Background: Starfield -->
<div aria-hidden="true" id="starfield">
<div id="stars"></div>
<div id="stars1"></div>
<div id="stars2"></div>
<div id="stars3"></div>
</div>
<div id="noise-overlay"></div>
<!-- EDITED: Added a class for layout control -->
<div class="relative z-10 content-wrapper">
<div id="header-container">
<header class="app-header glass-panel">
    <div class="header-row" id="primary-header-row">
        <div class="nav-buttons-container">
            <button class="nav-button" id="homeButton" data-nav="home">
                <img src="../assets/logos/App_Logo_icon256.png" alt="Dynasty Hub" class="nav-logo" aria-hidden="true" />
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-button" id="rostersButton" data-nav="rosters">
                <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>
                <span class="nav-label">Rosters</span>
            </button>
            <button class="nav-button" id="statsButton" data-nav="datahub">
                <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
              <span class="nav-label">DataHub</span>
            </button>
            <button class="nav-button" id="leagueHubButton" data-nav="leaguehub">
                <i class="fa-solid fa-square-poll-vertical" aria-hidden="true"></i>
                <span class="nav-label">LeagueHub</span>
            </button>
            <button class="nav-button" id="researchButton" data-nav="research">
                <i class="fa-solid fa-flask" aria-hidden="true"></i>
                <span class="nav-label">Research</span>
            </button>
      <button class="nav-button nav-more-toggle" id="moreButton" aria-haspopup="true" aria-expanded="false">
        <i class="fa-solid fa-toolbox" aria-hidden="true"></i>
        <span class="nav-label">More</span>
        <i class="fa-solid fa-caret-down nav-more-caret" aria-hidden="true"></i>
      </button>
      <!-- Ownership-local More menu anatomy: icon wells and supporting copy
           mirror Rosters while remaining independently styleable here. -->
      <div class="nav-more-dropdown hidden" id="moreDropdown" role="menu" aria-hidden="true">
        <button class="nav-more-item active" data-nav="ownership" role="menuitem">
          <span class="nav-more-item-icon" aria-hidden="true"><i class="fa-solid fa-percent"></i></span>
          <span class="nav-more-item-copy">
            <span class="nav-more-item-title">Ownership</span>
            <span class="nav-more-item-subtext">Player Exposures</span>
          </span>
        </button>
                <button class="nav-more-item" data-url="https://trophyroom.dynastyhub.pro/" role="menuitem">
          <span class="nav-more-item-icon" aria-hidden="true"><i class="fa-solid fa-trophy"></i></span>
          <span class="nav-more-item-copy">
            <span class="nav-more-item-title">Trophy Room</span>
            <span class="nav-more-item-subtext">Dyn. Career Profile</span>
          </span>
        </button>
                <button class="nav-more-item" data-url="http://dynastyhub-matchups.netlify.app/" role="menuitem">
          <span class="nav-more-item-icon" aria-hidden="true"><i class="fa-solid fa-table-columns"></i></span>
          <span class="nav-more-item-copy">
            <span class="nav-more-item-title">Matchups</span>
            <span class="nav-more-item-subtext">In-Season SoS Tool</span>
          </span>
        </button>
        <button class="nav-more-item" data-nav="contact" role="menuitem">
          <span class="nav-more-item-icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></span>
          <span class="nav-more-item-copy">
            <span class="nav-more-item-title">Contact</span>
            <span class="nav-more-item-subtext">Feedback</span>
          </span>
        </button>
      </div>
        </div>
    </div>
    <div id="contextual-controls">
        <div class="header-row" id="secondary-header-row">
            <!-- Ownership username bar: input + Enter button live inside the same glass pill -->
            <div class="username-area ownership-username-bar">
                <input autocapitalize="none" autocomplete="username" autocorrect="off" id="usernameInput" inputmode="text" name="username" placeholder="SLPR Username..." type="text" value="The_Oracle"/>
                <button id="ownershipUsernameSubmitButton" class="ownership-username-submit ownership-username-submit--inset" type="button" aria-label="Apply username and refresh ownership data">
                    <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
                    <span class="ownership-username-submit-label">Enter</span>
                </button>
            </div>
            <div id="ownershipModeSwitcher" class="ownership-mode-switcher" role="group" aria-label="Ownership views">
                <button id="ownershipModeOwnershipBtn" class="ownership-mode-btn is-active" data-ownership-mode="ownership" type="button" aria-pressed="true">
                    <i class="fa-solid fa-percent" aria-hidden="true"></i>
                    <span>Ownership</span>
                </button>
                <button id="ownershipModeValueBtn" class="ownership-mode-btn" data-ownership-mode="value" type="button" aria-pressed="false">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span>Player Value</span>
                </button>
            </div>
        </div>
        <div class="header-row" id="filters-row">
            <div class="start-sit-button-slot" id="start-sit-button-slot">
                <div class="start-sit-button-container">
                    <button class="menu-button analyzer-button start-sit-button" id="startSitButton" type="button" aria-label="Open Start/Sit recommendations">
                        <i class="fa-solid fa-elevator analyzer-icon" aria-hidden="true"></i>
                        <span class="analyzer-label">Start/Sit</span>
                    </button>
                </div>
            </div>
            <div class="filters-container">
                <div id="positional-filters">
                    <button class="filter-btn" data-position="QB">QB</button>
                    <button class="filter-btn" data-position="RB">RB</button>
                    <button class="filter-btn" data-position="WR">WR</button>
                    <button class="filter-btn" data-position="TE">TE</button>
                    <button class="filter-btn" data-position="FLX">FLX</button>
                </div>
                <button class="control-button-subtle" id="clearFiltersButton">
                    <span class="clear-filters-stack">
                        <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i>
                        <span class="sr-only">Clear filters</span>
                    </span>
                </button>
                <div class="compare-controls">
                    <button class="control-button hidden" id="compareButton" aria-hidden="true" tabindex="-1" style="display:none;"></button>
                    <button id="compareSearchToggle" class="control-button-subtle compare-search-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="compareSearchPopover">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <span class="sr-only">Search teams</span>
                    </button>
                    <div id="compareSearchPopover" class="compare-search-popover hidden" role="dialog" aria-modal="false">
                        <button type="button" id="compareSearchClose" class="compare-search-close" aria-label="Close search popover">
                            <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
                        </button>
                        <label for="compareSearchInput" class="sr-only">Search teams</label>
                        <input id="compareSearchInput" type="search" placeholder="Search Players…" autocomplete="off" inputmode="search" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
</div>
<main class="container mx-auto" id="content">
<section aria-label="Player Card Legend" class="hidden legend-section panel" id="legend-section"><h3 class="panel-title">Player Card Legend</h3><div aria-label="Roster Player Card Key" class="player-row legend-card" id="rosterPlayerCardKey" role="region">
<!-- Top row: Position tag + Player  -->
<div class="player-main-line legend-main">
<span class="player-tag legend-pos">POSITION</span>
<span class="player-name legend-name">PLAYER NAME</span>
</div>
<!-- Middle row: Position Rank • Age • Team tag (right aligned) -->
<div class="player-meta-line legend-meta">
<span class="player-pos-rank legend-pos-rank">POSITION<br/>RANK (KTC)</span>
<span class="separator">•</span>
<span><span class="player-age legend-age">AGE</span></span>
<span class="separator">•</span>
<span class="team-tag legend-team">TEAM</span>
</div>
<!-- Bottom row: KTC left, ADP right (no chips) -->
<div class="player-value-line legend-bottom"><div class="legend-bottom-bg">
<span class="kv-left"><span class="value player-ktc legend-ktc">KTC VALUE</span></span>
<span class="kv-right"><span class="value player-adp legend-adp">ADP</span></span>
</div></div>
</div><div class="legend-footnote" id="rosterCardFootnote">KTC VALUE AND ADP ARE SPECIFIC TO LEAGUE SCORING / FORMAT.</div></section>
<div id="loading" class="hidden">
  <div class="loading-overlay" role="alert" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-body">
      <img
        src="../assets/welcome/welcome-logo-256.png"
        alt="Dynasty Hub"
        width="216"
        height="216"
        decoding="async"
        loading="eager"
        class="loading-logo"
      />
      <div class="loading-text">
        <span class="loading-message">Loading…</span>
      </div>
    </div>
  </div>
</div>
<div class="hidden" id="rosterView">
<div id="rosterContainer">
<div id="rosterGrid"></div>
</div>
</div>
<div class="hidden" id="playerListView">
</div>
</main>
<div id="tradeSimulator">
</div>
</div>

<!-- Ownership page player detail modal (matches the game-log modal header style and chip system). -->
<div id="ownershipPlayerModal" class="hidden" aria-hidden="true">
  <div class="modal-overlay"></div>
  <div class="modal-content glass-panel ownership-modal-content" role="dialog" aria-modal="true" aria-labelledby="ownershipModalPlayerName">
    <button class="modal-close-btn ownership-modal-close" type="button" aria-label="Close player ownership details">&times;</button>
    <div id="ownershipModalHeader" class="ownership-modal-header">
      <div id="ownershipModalLeft" class="modal-header-left-container"></div>
      <h3 id="ownershipModalPlayerName">Player Ownership Details</h3>
      <div id="ownershipModalPlayerVitals"></div>
      <div id="ownershipModalSummaryRow">
        <div id="ownershipModalSummaryChips"></div>
      </div>
    </div>
    <div id="ownershipModalBody" class="ownership-modal-body"></div>
  </div>
</div>

<script defer="True" src="../scripts/app.js?v=DH3.45i-ownership-sflx-sort"></script>
